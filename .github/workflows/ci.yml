name: CI Quality Gate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Lint, Typecheck, Test, Build & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Safe dummy public variables for CI build validation
      NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key-for-ci-build-validation-only-00000000000000000000
      NEXT_PUBLIC_SITE_URL: https://5000shop.pk
      NEXT_PUBLIC_WHATSAPP_NUMBER: "923001234567"
      # Non-sensitive dummy placeholder for build compilation
      SUPABASE_SERVICE_ROLE_KEY: dummy-service-role-key-for-ci-build-validation-only
      ADMIN_EMAILS: admin@5000shop.pk
      CI: "true"

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint Check
        run: npm run lint

      - name: TypeScript Compilation Check
        run: npx tsc --noEmit

      - name: Automated Unit & API Route Tests (Vitest)
        run: npm test

      - name: Next.js Production Build
        run: npm run build

      - name: Audit Client Bundle for Secret Leaks
        run: node scripts/check-bundle-secrets.mjs

      - name: Dependency Vulnerability Audit (Production)
        run: npm audit --omit=dev --audit-level=high
